name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      GSK_RENDERER: cairo  # the server has no GPU; real PCs use their own renderer
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
      - name: Install MSYS2 packages
        # mirror.msys2.org has stalled for whole runs; try another mirror first, and retry.
        run: |
          for repo in mingw msys; do
            list=/etc/pacman.d/mirrorlist.$repo
            path='mingw/$repo'; [ $repo = msys ] && path='msys/$arch'
            { for host in https://mirrors.dotsrc.org/msys2; do echo "Server = $host/$path/"; done; cat $list; } > $list.new
            mv $list.new $list
          done
          for attempt in 1 2 3; do
            pacman -Sy --noconfirm --needed \
              mingw-w64-ucrt-x86_64-python \
              mingw-w64-ucrt-x86_64-python-gobject \
              mingw-w64-ucrt-x86_64-python-pip \
              mingw-w64-ucrt-x86_64-gtk4 \
              mingw-w64-ucrt-x86_64-libadwaita \
              mingw-w64-ucrt-x86_64-librsvg && break
            echo "install attempt $attempt failed; retrying in 30s"; sleep 30
            [ $attempt = 3 ] && exit 1
          done
      - name: Unit tests
        run: python -m unittest -v test_rs3comp
      - name: Self-test
        run: python -u -X faulthandler rs3comp_gui.py --self-test
      - name: Package
        run: |
          pip install -q --break-system-packages pyinstaller pyinstaller-hooks-contrib
          python - <<'EOF'
          import gi
          gi.require_version("GdkPixbuf", "2.0")
          from gi.repository import GdkPixbuf
          icon = GdkPixbuf.Pixbuf.new_from_file_at_size("data/co.redbarn.CompletionistGuide.svg", 256, 256)
          icon.savev("redbarn-completionist.ico", "ico", [], [])
          EOF
          pyinstaller --noconfirm --log-level WARN .github/windows-package.spec
          cp LICENSE README.md "dist/Redbarn Completionist/"
          du -sh "dist/Redbarn Completionist"
      - name: Test the package
        run: |
          ./dist/"Redbarn Completionist"/"Redbarn Completionist.exe" --self-test | tee selftest.txt
          grep -q "self-test passed" selftest.txt || { echo "packaged self-test failed"; exit 1; }
          ./dist/"Redbarn Completionist"/"Redbarn Completionist.exe" &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then echo "window still open after 20s"; kill $pid; else wait $pid; echo "app exited early with code $?"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Redbarn-Completionist-Windows
          path: dist/Redbarn Completionist
